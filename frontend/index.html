<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>chinese-OCR</title>
</head>
<body class="results">
  <div id="app">
    <div id="titlebar">
      <span class="app-title">Chinese OCR</span>
      <button id="close-btn" title="Hide to tray">×</button>
    </div>

    <!-- Tab bar for the user-navigable views (hidden in overlay/settings). -->
    <div id="tabs" hidden>
      <button class="tab" data-view="capture">Capture</button>
      <button class="tab" data-view="history">History</button>
    </div>

    <div id="content">
      <p id="status">Loading…</p>
      <p id="result" class="hanzi"></p>
      <div class="btn-row">
        <button id="capture-btn">Capture</button>
        <button id="copy-btn">Copy</button>
      </div>
    </div>

    <!-- Hover-lookup overlay (transparent, click-through) — a card that follows
         the cursor. For now it shows a fixed test card to validate the window
         plumbing; OCR/dictionary wiring comes next. -->
    <div id="overlay-view" hidden>
      <div id="overlay-debug"></div>
      <div id="overlay-card" hidden>
        <div class="oc-word">测试</div>
        <div class="oc-pinyin">cè shì</div>
        <div class="oc-sense">test overlay — this card follows the cursor</div>
      </div>
    </div>

    <!-- Archived learning sessions. -->
    <div id="history-view" hidden>
      <div class="hist-head">
        <span id="hist-title">Past sessions</span>
      </div>
      <div id="hist-list" class="table-wrap"></div>
    </div>

    <!-- Settings form. -->
    <div id="settings-view" hidden>
      <h2 class="settings-title">Settings</h2>
      <div class="settings-body">
        <label class="set-row">
          <span>Overlay hotkey
            <i class="help" data-tip="Global shortcut that toggles the hover overlay: it freezes the screen's text and shows pinyin + meaning for the word under your mouse.">?</i>
          </span>
          <input id="set-hk-overlay" class="hk-input" type="text" readonly placeholder="click &amp; press keys" />
        </label>
        <label class="set-row">
          <span>Capture hotkey
            <i class="help" data-tip="Global shortcut that starts a screenshot: you drag a region and its Chinese text is extracted.">?</i>
          </span>
          <input id="set-hk-capture" class="hk-input" type="text" readonly placeholder="click &amp; press keys" />
        </label>
        <label class="set-row">
          <span>Dictionary
            <i class="help" data-tip="Dictionary file used for pinyin and definitions. Drop other CC-CEDICT/CFDICT files (.u8) into the dicts folder to add languages.">?</i>
          </span>
          <select id="set-dict"></select>
        </label>
        <label class="set-row">
          <span>Min confidence <em id="set-conf-val"></em>
            <i class="help" data-tip="How sure the OCR must be before a word is shown. Higher = fewer mistakes but some text ignored; lower = more text but more noise.">?</i>
          </span>
          <input id="set-conf" type="range" min="0" max="1" step="0.05" />
        </label>
        <label class="set-row">
          <span>Detection resolution
            <i class="help" data-tip="Image size the text detector works at. Higher finds smaller text but is slower; Auto matches your screen (capped at 2560).">?</i>
          </span>
          <select id="set-maxside">
            <option value="0">Auto</option>
            <option value="1280">1280</option>
            <option value="1920">1920</option>
            <option value="2560">2560</option>
            <option value="3840">3840</option>
          </select>
        </label>
        <label class="set-row">
          <span>Captured display
            <i class="help" data-tip="Which monitor the screenshot, overlay and learning session capture. The map below shows your monitor layout.">?</i>
          </span>
          <select id="set-display"></select>
        </label>
        <div id="set-display-map" class="display-map"></div>
        <p id="set-msg"></p>
      </div>
      <div class="btn-row"><button id="set-close">Close</button></div>
    </div>

    <!-- Learning-session summary view (shown after a recording session stops). -->
    <div id="session-view" hidden>
      <div id="session-progress-wrap">
        <p id="session-progress">Preparing…</p>
        <div class="bar-track"><div id="session-bar"></div></div>
      </div>

      <div id="session-summary" hidden>
        <div class="summary-head">
          <span id="summary-title"></span>
          <div class="sort-row">
            <button id="sort-count" class="active">By count</button>
            <button id="sort-time">By time</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>词</th><th>Count</th><th>On&nbsp;screen</th><th></th></tr></thead>
            <tbody id="summary-body"></tbody>
          </table>
        </div>
        <div class="btn-row">
          <button id="export-csv">Export CSV</button>
          <button id="session-done">Done</button>
        </div>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="./src/style.css" />
  <script src="./src/main.js" type="module"></script>
</body>
</html>
