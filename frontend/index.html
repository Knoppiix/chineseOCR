<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>chinese-OCR</title>
</head>
<body class="results">
  <div id="app">
    <div id="titlebar">
      <span class="app-title">Chinese OCR</span>
      <button id="close-btn" title="Hide to tray">×</button>
    </div>

    <div id="content">
      <p id="status">Loading…</p>
      <p id="result" class="hanzi"></p>
      <div class="btn-row">
        <button id="capture-btn">Capture</button>
        <button id="copy-btn">Copy</button>
      </div>
    </div>

    <!-- Hover-lookup overlay (transparent, click-through) — a card that follows
         the cursor. For now it shows a fixed test card to validate the window
         plumbing; OCR/dictionary wiring comes next. -->
    <div id="overlay-view" hidden>
      <div id="overlay-card" hidden>
        <div class="oc-word">测试</div>
        <div class="oc-pinyin">cè shì</div>
        <div class="oc-sense">test overlay — this card follows the cursor</div>
      </div>
    </div>

    <!-- Learning-session summary view (shown after a recording session stops). -->
    <div id="session-view" hidden>
      <div id="session-progress-wrap">
        <p id="session-progress">Preparing…</p>
        <div class="bar-track"><div id="session-bar"></div></div>
      </div>

      <div id="session-summary" hidden>
        <div class="summary-head">
          <span id="summary-title"></span>
          <div class="sort-row">
            <button id="sort-count" class="active">By count</button>
            <button id="sort-time">By time</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>词</th><th>Count</th><th>On&nbsp;screen</th><th></th></tr></thead>
            <tbody id="summary-body"></tbody>
          </table>
        </div>
        <div class="btn-row">
          <button id="export-csv">Export CSV</button>
          <button id="session-done">Done</button>
        </div>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="./src/style.css" />
  <script src="./src/main.js" type="module"></script>
</body>
</html>
